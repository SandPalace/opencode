name: Upstream Sync

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Register the `ours` merge driver referenced in .gitattributes so
          # PIXI-owned files (branding, theme, bin, CI, etc.) survive upstream syncs.
          git config merge.ours.driver true

      - name: Add upstream remote
        run: git remote add upstream https://github.com/anomalyco/opencode.git || true

      - name: Fetch upstream
        run: git fetch upstream dev

      - name: Check for new upstream commits
        id: check
        run: |
          UPSTREAM_COMMITS=$(git log HEAD..upstream/dev --oneline)
          if [ -z "$UPSTREAM_COMMITS" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream commits."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "$UPSTREAM_COMMITS" > /tmp/upstream-commits.txt
            COMMIT_COUNT=$(echo "$UPSTREAM_COMMITS" | wc -l | tr -d ' ')
            echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt merge on sync branch
        if: steps.check.outputs.has_changes == 'true'
        id: merge
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="chore/upstream-sync-${DATE}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          # Abort if the branch already exists on origin — don't clobber an in-flight sync PR.
          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "Sync branch ${BRANCH} already exists on origin, skipping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

          git checkout -b "$BRANCH" dev

          # Attempt merge. If there are conflicts the merge step will fail but leave
          # conflict markers staged — we then commit a WIP state so humans can resolve
          # on the PR. Clean merges commit normally.
          if git merge --no-ff upstream/dev -m "chore: sync upstream opencode (${DATE})"; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
            # Stage everything including conflict markers, commit as WIP.
            git add -A
            git commit --no-verify -m "WIP: sync upstream opencode (${DATE}) — UNRESOLVED CONFLICTS"
          fi

          git push origin "$BRANCH"

      - name: Open PR
        if: steps.check.outputs.has_changes == 'true' && steps.merge.outputs.skipped == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            const branch = '${{ steps.merge.outputs.branch }}';
            const conflicts = '${{ steps.merge.outputs.conflicts }}' === 'true';
            const commitCount = '${{ steps.check.outputs.commit_count }}';
            const commits = fs.readFileSync('/tmp/upstream-commits.txt', 'utf8').trim();

            const title = conflicts
              ? `chore: sync upstream opencode ${date} (conflicts)`
              : `chore: sync upstream opencode ${date}`;

            const bodyLines = [
              `## Upstream Sync — ${date}`,
              '',
              `Merging **${commitCount}** new commit(s) from [upstream opencode](https://github.com/anomalyco/opencode) \`dev\` into our \`dev\`.`,
              '',
            ];

            if (conflicts) {
              bodyLines.push(
                '> **Merge conflicts detected.** The sync branch has a WIP commit with conflict markers. Check out the branch locally, resolve conflicts, and force-push before merging.',
                '',
                '```bash',
                `git fetch origin ${branch}`,
                `git checkout ${branch}`,
                'git reset --soft HEAD~1  # drop WIP commit, keep changes staged',
                '# resolve conflicts, then:',
                `git commit -m "chore: sync upstream opencode ${date}"`,
                `git push --force-with-lease origin ${branch}`,
                '```',
                '',
              );
            } else {
              bodyLines.push(
                '> Merge completed cleanly. Review for correctness before merging.',
                '',
              );
            }

            bodyLines.push(
              '### Upstream commits',
              '```',
              commits,
              '```',
              '',
              '> **Verify PIXI branding survived**: `packages/opencode/package.json` name is `pixicode`, `packages/opencode/src/constants/branding.ts` is unchanged, pixi themes present, `bin/pixi` launcher unchanged.',
            );

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              head: branch,
              base: 'dev',
              body: bodyLines.join('\n'),
              draft: conflicts,
            });

            console.log(`PR opened for ${commitCount} upstream commits (conflicts: ${conflicts}).`);
