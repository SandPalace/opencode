name: Publish to npm

on:
  push:
    tags: ['pixi-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install
      - run: bun run build
        working-directory: packages/opencode
      - name: Prepare package for publish
        working-directory: packages/opencode
        run: |
          # Keep only the most common platforms to stay under npm size limits
          cd dist
          rm -rf pixicode-windows-* pixicode-linux-*-musl pixicode-linux-*-baseline* pixicode-darwin-x64-baseline
          ls -la
          cd ..
          # Strip dependencies — the binary is self-contained, no npm deps needed
          node -e "
            const pkg = require('./package.json');
            delete pkg.dependencies;
            delete pkg.devDependencies;
            delete pkg.peerDependencies;
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
      - run: npm publish --access public
        working-directory: packages/opencode
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
