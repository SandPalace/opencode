name: Publish to npm

on:
  push:
    tags: ['pixi-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install
      - run: bun run build
        working-directory: packages/opencode
      - name: Create GitHub Release with Windows binaries
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const tag = context.ref.replace('refs/tags/', '')
            const version = tag.replace('pixi-v', '')

            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `pixicode v${version}`,
              body: `Release of pixicode v${version}`,
              draft: false,
              prerelease: false,
            })

            const distDir = 'packages/opencode/dist'
            const windowsDirs = fs.readdirSync(distDir).filter(d => d.startsWith('pixicode-windows-'))
            for (const dir of windowsDirs) {
              const binPath = path.join(distDir, dir, 'bin', 'pixi.exe')
              if (!fs.existsSync(binPath)) continue
              const data = fs.readFileSync(binPath)
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: `${dir}.exe`,
                data,
              })
              console.log(`Uploaded ${dir}.exe`)
            }
      - name: Prepare package for publish
        working-directory: packages/opencode
        run: |
          # Keep only the most common platforms to stay under npm size limits
          cd dist
          rm -rf pixicode-windows-* pixicode-linux-*-musl pixicode-linux-*-baseline* pixicode-darwin-x64-baseline
          ls -la
          cd ..
          # Strip dependencies — the binary is self-contained, no npm deps needed
          node -e "
            const pkg = require('./package.json');
            delete pkg.dependencies;
            delete pkg.devDependencies;
            delete pkg.peerDependencies;
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
      - run: npm publish --access public
        working-directory: packages/opencode
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
